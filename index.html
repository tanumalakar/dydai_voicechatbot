<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>DYD AI Project - Voice Chat</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #eef7ff, #f8fbff);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      background: #ffffff;
      border-radius: 24px;
      padding: 40px 25px;
      text-align: center;
      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.10);
    }

    .logo {
      width: 75px;
      height: 75px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0066ff, #00b894);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 25px;
      font-weight: bold;
    }

    h1 {
      font-size: 32px;
      color: #12304a;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #667788;
      font-size: 16px;
      margin-bottom: 30px;
    }

    .voice-chat-section {
      border: 1px solid #e4edf5;
      border-radius: 20px;
      padding: 30px 20px;
      background: #f9fcff;
    }

    .voice-icon {
      font-size: 55px;
      margin-bottom: 15px;
    }

    .voice-chat-section h2 {
      color: #12304a;
      margin-bottom: 8px;
    }

    .voice-chat-section p {
      color: #68798a;
      margin-bottom: 25px;
    }

    .elevenlabs-widget {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100px;
    }

    .footer {
      margin-top: 25px;
      font-size: 13px;
      color: #8a98a6;
    }

    @media (max-width: 600px) {
      .container {
        padding: 30px 15px;
      }

      h1 {
        font-size: 25px;
      }

      .voice-chat-section {
        padding: 25px 12px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      DYD
    </div>

    <h1>DYD AI Project</h1>

    <p class="subtitle">
      AI Voice Chatbot for Student Support
    </p>

    <div class="voice-chat-section">

      <div class="voice-icon">🎙️</div>

      <h2>Talk with DYD AI Assistant</h2>

      <p>
        Speak with our AI Assistant in Bangla or English.
      </p>

      <div class="elevenlabs-widget">

        <!-- ElevenLabs Voice Chat -->
        <elevenlabs-convai
          agent-id="agent_2001m34q7wj3f8wr4n9j130a3n2h">
        </elevenlabs-convai>

      </div>

    </div>

    <div class="footer">
      © 2026 DYD AI Project • AI Student Support
    </div>

  </div>


  <!-- ElevenLabs ConvAI Widget -->
  <script
    src="https://unpkg.com/@elevenlabs/convai-widget-embed"
    async
    type="text/javascript">
  </script>

</body>
</html>
